<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{META_DESCRIPTION}}">
<link rel="canonical" href="{{CANONICAL_URL}}">

<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#FAF6F0">

<meta property="og:type" content="website">
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESCRIPTION}}">
<meta property="og:url" content="{{OG_URL}}">
<meta property="og:image" content="https://vibequiz.online/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{OG_DESCRIPTION}}">
<meta name="twitter:image" content="https://vibequiz.online/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Space+Grotesk:wght@400..700&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="/quiz-engine.min.js" defer></script>

<script type="application/ld+json">{{JSON_LD}}</script>

<!-- Replace with real GA4 ID -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-XXXXXXXXXX');
</script>
</head>
<body>

<div class="wrap">
  <header class="site-header">
    <div class="logo">vibequiz</div>
    {{NAV_HTML}}
    <div class="tagline" id="tagline">find out what you actually are</div>
  </header>

  <main>
    {{FLAGSHIP_CARD_HTML}}

    <div id="passport-strip"></div>

    <div class="secondary-grid">
      {{SECONDARY_CARDS_HTML}}
    </div>

    {{HOMEPAGE_CONTENT}}
  </main>

  <footer class="site-footer">
    <p class="footer-links">{{FOOTER_LINKS}}</p>
    <p class="footer-domain">vibequiz.online</p>
  </footer>
</div>

</body>
</html>
